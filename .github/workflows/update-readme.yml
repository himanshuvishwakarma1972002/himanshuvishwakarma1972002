name: Update Dynamic README

on:
  schedule:
  # Every Monday at 00:00 UTC (weekly auto-update)
  - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Generate README content
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL: gpt-4o-mini
      run: node scripts/generateReadme.js

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if git diff --quiet README.md; then
          echo "No changes to commit"
          exit 0
        fi

        git add README.md
        git commit -m "docs: auto-update README with AI-generated content [skip ci]"
        git push
